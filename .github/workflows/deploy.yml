steps:
  # Passo 1: O GitHub baixa o código do seu repositório
  - name: Checkout Repo
    uses: actions/checkout@v4

  # Passo 2: O GitHub se autentica na sua AWS usando as chaves secretas
  - name: Configure AWS Credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: us-east-1 # Mude se o seu bucket não estiver em N. Virginia (us-east-1)

  # Passo 3: Sincroniza os arquivos com o S3
  - name: Sync files to S3 Bucket
    run: |
      aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }} --delete --exclude ".git/*" --exclude ".github/*"

  # Passo 4: Limpa o Cache do CloudFront
  - name: Invalidate CloudFront Cache
    run: |
      aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
